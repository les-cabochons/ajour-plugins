name: Check plugins

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      plugins:
        description: Plugins to test. "all", or folder names under plugins/ separated by commas.
        required: true
        default: all

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Choose plugins
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_PLUGINS: ${{ inputs.plugins }}
        run: node scripts/plan-ci.mjs

  plugin:
    name: Test ${{ matrix.plugin }}
    needs: plan
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Ajour runs plugins on Node 24, inside Electron 44. Fetch the newest
          # 24.x patch rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        working-directory: .
        run: corepack enable

      - name: Install dependencies
        working-directory: .
        run: corepack pnpm install --frozen-lockfile

      - name: Run tests
        run: corepack pnpm test

      - name: Run checks
        run: corepack pnpm run --if-present typecheck

  source:
    name: Check plugin source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # ajour.json pins earlier commits; verify reads each file at its commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Ajour runs plugins on Node 24, inside Electron 44. Fetch the newest
          # 24.x patch rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      # No install: the scripts use Node.js alone, and the smoke import proves
      # each plugin runs from its published files without node_modules.
      - name: Test the source scripts
        run: node --test "scripts/*.test.mjs"

      - name: Import each plugin in plain Node
        run: node scripts/smoke-import.mjs

      - name: Check ajour.json
        run: node scripts/ajour-source.mjs verify
