name: Build plugin

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Ajour runs plugins on Node 24, inside Electron 44. Fetch the newest
          # 24.x patch rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Verify plugin
        run: corepack pnpm verify
